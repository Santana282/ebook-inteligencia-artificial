<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inteligencia Artificial: De LLMs a Sistemas Cognitivos</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>
    <!-- Barra de progreso superior -->
    <div id="reading-progress-bar"></div>

    <div class="app-container">
        <!-- Panel lateral: Navegación -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2>Santana eBook</h2>
                <button id="close-sidebar" class="mobile-only" aria-label="Cerrar menú">×</button>
            </div>
            <nav id="toc-nav" aria-label="Índice de contenidos">
                <!-- Se inyecta dinámicamente vía app.js -->
                <ul id="toc-list"></ul>
            </nav>
        </aside>

        <!-- Contenedor Principal -->
        <main class="main-content">
            <!-- Cabecera de controles -->
            <header class="top-bar">
                <div class="left-controls">
                    <button id="toggle-sidebar" aria-label="Abrir menú">☰ Índice</button>
                </div>
                <div class="right-controls">
                    <button id="btn-font-decrease" aria-label="Reducir letra">A-</button>
                    <button id="btn-font-increase" aria-label="Aumentar letra">A+</button>
                    <button id="btn-theme" aria-label="Alternar modo oscuro">🌓</button>
                    <button id="btn-search" aria-label="Buscar">🔍</button>
                </div>
            </header>

            <!-- Área donde se cargan los capítulos -->
            <article id="reader-view" class="reader-view" aria-live="polite">
                <!-- Contenido dinámico -->
                <div class="loader">Cargando contenido...</div>
            </article>

            <!-- Controles de paginación inferiores -->
            <nav class="bottom-nav">
                <button id="btn-prev" disabled>← Anterior</button>
                <span id="chapter-indicator">Capítulo - / -</span>
                <button id="btn-next" disabled>Siguiente →</button>
            </nav>
        </main>
    </div>

    <script type="module" src="js/app.js"></script>
    <div id="search-modal" class="modal" aria-hidden="true" style="display: none;">
        <div class="modal-content">
            <header class="modal-header">
                <h2>Buscar en el libro</h2>
                <button id="btn-close-search" aria-label="Cerrar búsqueda">×</button>
            </header>
            <div class="search-body">
                <input type="search" id="search-input" placeholder="Ej. Redes Neuronales, Embedding..." autocomplete="off">
                <div id="search-status" class="search-status"></div>
                <ul id="search-results" class="search-results-list" aria-live="polite"></ul>
            </div>
        </div>
    </div>
    <!-- Modal/Tarjeta de Glosario Interactivo -->
    <div id="glossary-modal" class="modal" aria-hidden="true" style="display: none; z-index: 2050;">
        <div class="modal-content glossary-card">
            <header class="modal-header">
                <h2 id="glossary-term-title">Término</h2>
                <button id="btn-close-glossary" aria-label="Cerrar definición">×</button>
            </header>
            <div class="glossary-body">
                <div class="def-level def-simple">
                    <span class="def-badge">Sencillo</span>
                    <p id="glossary-simple"></p>
                </div>
                <div class="def-level def-tech">
                    <span class="def-badge badge-tech">Técnico</span>
                    <p id="glossary-tech"></p>
                </div>
                <div class="def-level def-example">
                    <strong>Ejemplo:</strong> <span id="glossary-example"></span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
